cambridge_water_tnt:
  db_name: "Cambridge Water"
  company_id: tnt
  site_code: CAMBRIDGE
  utility_name: "Water"
  aliases:
    - Cambridge Water
    - City of Cambridge
    - City of Cambridge Water
  accounts: []
  # Existing archive (May/June bills) is flat, no "Cambridge" subfolder —
  # and nesting one caused a real, repeatable problem: files placed in a
  # brand-new "Cambridge" subfolder kept ending up unreachable via the
  # OneDrive share link generated right after archiving (confirmed on the
  # Jul/Aug 2026 bills), even though the exact same drive/path setup works
  # fine for every other vendor's flat and nested folders alike.
  flat_archive: true
  # Confirmed by the user 2026-08-11: this account is on auto-pay.
  auto_pay: true

