# Vendor config, keyed by a unique internal vendor_key.
#
# db_name must match utility_vendors.name EXACTLY for that company_id
# (looked up live from Supabase at runtime — no UUIDs are hardcoded here,
# since row IDs can differ across environments).
#
# accounts: known account numbers -> instantly resolves vendor + site with
# highest confidence (classification priority #1). Add new accounts here as
# soon as they're known (e.g. once TNT Biscayne/Pickering utilities are set
# up in the utility_vendors/utility_service_accounts tables).
#
# aliases: text variants seen in real bill PDFs, used for text-based
# vendor-phrase classification (priority #4) when the account number isn't
# recognized yet.
#
# archive_folder (optional): the vendor subfolder name to file processed
# PDFs into under ROOT/{COMPANY}/. Defaults to db_name. Set this explicitly
# when the folder already on disk doesn't exactly match db_name, so new
# bills land next to the existing historical ones instead of splitting the
# archive across two folders.
#
# flat_archive (optional, default false): skip nesting into a per-site
# subfolder (ROOT/{COMPANY}/{VENDOR}/{SITE}/) even when the company is
# multi_site — file straight into ROOT/{COMPANY}/{VENDOR}/ instead. Set this
# for a vendor whose existing archive folder is already flat, or whose name
# already implies the site (e.g. "Cambridge Water").
#
# auto_pay (optional, default false): every bill this vendor's extractor
# registers gets is_auto_pay=true, even though nothing in the PDF itself
# says so (unlike e.g. Orkin, whose $0-printed total is a real in-PDF
# signal) — for accounts you know are on auto-pay from outside the bill.

rogers_afs:
  db_name: "Rogers"
  company_id: afs
  site_code: SURREY
  utility_name: "Business Phone"
  aliases:
    - Rogers
    - Rogers Communications
    - ROGERS
  accounts:
    - "5-0781-2423"

telus_afs:
  db_name: "Telus"
  company_id: afs
  site_code: SURREY
  utility_name: "Internet (Wifi)"
  aliases:
    - Telus
    - TELUS
    - TELUS Communications
  accounts:
    - "6070393200"

cambridge_water_tnt:
  db_name: "Cambridge Water"
  company_id: tnt
  site_code: CAMBRIDGE
  utility_name: "Water"
  aliases:
    - Cambridge Water
    - City of Cambridge
    - City of Cambridge Water
  accounts: []
  # Existing archive (May/June bills) is flat, no "Cambridge" subfolder —
  # and nesting one caused a real, repeatable problem: files placed in a
  # brand-new "Cambridge" subfolder kept ending up unreachable via the
  # OneDrive share link generated right after archiving (confirmed on the
  # Jul/Aug 2026 bills), even though the exact same drive/path setup works
  # fine for every other vendor's flat and nested folders alike.
  flat_archive: true

enbridge_tnt:
  db_name: "Enbridge"
  company_id: tnt
  site_code: CAMBRIDGE
  utility_name: "Gas"
  aliases:
    - Enbridge
    - Enbridge Gas
  accounts: []

grandbridge_tnt:
  db_name: "Grandbridge"
  archive_folder: "Grand Bridge"  # matches the existing folder on disk under TNT\
  company_id: tnt
  site_code: CAMBRIDGE
  utility_name: "Electrictity"
  aliases:
    - Grandbridge
    - GrandBridge Energy
    - Grand Bridge
  accounts: []

# TNT has two Rogers accounts at two different sites. Originally one shared
# utility_vendors row ("Rogers"), which merged both sites' bills/averages
# into a single line in the Vendors UI -- split into two separate DB vendor
# rows 2026-08-13 ("Cambridge Rogers" / "Biscayne Rogers", db_name below
# must match each row's `name` exactly for resolve_vendor to find it).
# archive_folder keeps both filing into the existing TNT\Rogers\... folder
# tree rather than splitting into new TNT\Cambridge Rogers\... folders.
rogers_tnt_cambridge:
  db_name: "Cambridge Rogers"
  archive_folder: "Rogers"
  company_id: tnt
  site_code: CAMBRIDGE
  utility_name: "Internet"
  aliases:
    - Rogers
    - Rogers Communications
    - ROGERS
  accounts:
    - "860900"

# Without the account number below, a Biscayne bill still classifies
# correctly as long as "Biscayne" appears somewhere in the PDF text
# (classifier.py's site_alias step, sites.yaml's BISCAYNE aliases).
rogers_tnt_biscayne:
  db_name: "Biscayne Rogers"
  archive_folder: "Rogers"
  company_id: tnt
  site_code: BISCAYNE
  utility_name: "Internet (Wifi)"
  aliases:
    - Rogers
    - Rogers Communications
    - ROGERS
  accounts:
    # A Rogers 5G wireless account -> dedicated 5G router/modem -> WiFi
    # for the Biscayne office. The Rogers *contract* is under AFS's name
    # ("ACME FREIGHT SALES LIMITED", billed to the Surrey address) even
    # though the service itself is used at TNT Biscayne -- confirmed by
    # the user 2026-08-13. This means the bill's own text always says
    # "Surrey"/AFS, never "Biscayne"/TNT, so classifier.py's site-alias
    # text fallback would otherwise misroute it to rogers_afs every time
    # -- the account number below is the *only* reliable signal and must
    # stay in this list.
    - "5-0882-6140"

